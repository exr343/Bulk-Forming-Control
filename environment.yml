name: jax-fem-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python==3.10.18
  - numpy==2.2.6
  - scipy==1.15.2
  - matplotlib==3.10.3
  - meshio==5.3.5
  - petsc4py==3.23.4
  - pip==25.1.1
  - fenics==2019.1.0
  - pip:
    - setuptools==80.9.0
    - wheel==0.45.1
    - gmsh==4.14.0
    - fenics-basix==0.9.0
    - pyfiglet==1.0.3
    # Required by jax_forge (applications/Agility_Forge's FEM core) and by
    # applications/Agility_Forge/koopman (PyTorch training). Versions pinned
    # to what's actually active in jax-fem-env.
    - jax==0.6.2
    - jaxlib==0.6.2
    # torch: a plain `pip install torch==2.11.0` here may resolve to a
    # different CUDA build than the cu128 one actually installed and tested
    # -- this cluster's GPU driver (checked across V100/A100/P100 nodes, all
    # on branch R570) caps out at CUDA 12.8, so `torch.cuda.is_available()`
    # silently returns False under a newer CUDA build instead of failing
    # loudly. After `conda env create`, explicitly reinstall against the
    # matching wheel index:
    #   pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cu128
    - torch==2.11.0
